name: CI - Verificación Python & Java

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Configurar Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Ejecutar pruebas de Python y Java Tradicional
      run: |
        python 01_codigo_basico/codigo_basico.py
        java 01_codigo_basico/CodigoBasicoTradicional.java
        echo "4" | python 02_entrada_datos/entrada_datos.py
        echo "4" | java 02_entrada_datos/EntradaDatosTradicional.java

    - name: Ejecutar Suite Automatizada
      run: |
        python test_runner.py
